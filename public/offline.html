<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <title>Savor — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 2rem; background: #faf8f5; color: #1c1917; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 24rem; }
      img { width: 7rem; height: 7rem; border-radius: 1.5rem; }
      h1 { margin: 1.25rem 0 .5rem; font-family: Georgia, serif; }
      p { color: #57534e; line-height: 1.5; }
      button { margin-top: 1rem; border: 0; border-radius: 999px; padding: .8rem 1.25rem; background: #14532d; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.png" alt="Savor" />
      <h1>You’re offline</h1>
      <p>Reconnect to load recipes and community updates.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
